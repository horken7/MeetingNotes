name: Windows

# Builds and tests the Windows app (windows/) and makes MeetingNotes-Setup.exe. On a v* tag the installer is
# uploaded to that GitHub Release, next to the Mac .dmg from the Mac release job. The release-please workflow also
# calls it (workflow_call) with the tag it just created, since tags made with GITHUB_TOKEN do not trigger workflows.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "windows/**"
      - "LICENSE"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "The release tag (vX.Y.Z) to build and upload to"
        required: true
        type: string

env:
  # The release tag: the workflow_call input, or the pushed v* tag; empty for other builds.
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Version
        shell: pwsh
        run: |
          # The tag's version for releases, otherwise the repository's version.txt.
          $v = (Get-Content version.txt -Raw).Trim()
          if ($env:TAG) { $v = $env:TAG.Substring(1) }
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Speech models cache
        uses: actions/cache@v4
        with:
          path: windows/.models
          # Bump when the pinned models in windows/build.ps1 change.
          key: whisper-models-large-v3-turbo-5359861-silero-v5.1.2
      - name: Build, test and make the installer
        shell: pwsh
        run: ./windows/build.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingNotes-Setup
          path: windows/artifacts/MeetingNotes-Setup.exe
          if-no-files-found: error

  release:
    needs: build
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MeetingNotes-Setup
          path: dist
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The Mac job may create the release at the same moment: create it only if missing,
          # and accept losing that race.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Meeting Notes ${TAG#v}" --generate-notes \
              || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" dist/MeetingNotes-Setup.exe --clobber
