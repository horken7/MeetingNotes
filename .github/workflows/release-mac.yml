name: Mac app (DMG)

# Builds MeetingNotes.dmg: the app with whisper-cli, llama-completion, the speech models, the built-in
# notes model (Gemma 3 4B), the MCP server and the Claude Desktop extension inside, ad hoc signed (not
# notarized). It is always kept as a workflow artifact (30 days). On a v* tag it is also uploaded to that
# GitHub Release, next to the Windows installer from the Windows job, but only while it is under GitHub's
# 2 GB limit for release files; with the notes model it is about 4 GB, so the release gets a notice instead and
# the disk image is hosted elsewhere by hand. The release-please workflow also calls it (workflow_call)
# with the tag it just created, since tags made with GITHUB_TOKEN do not trigger workflows.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "src/**"
      - "ios/MeetingCore/Sources/MeetingCore/Notes.swift"       # shared with the built-in notes model
      - "ios/MeetingCore/Sources/MeetingCore/Grounding.swift"
      - "ios/MeetingCore/Sources/MeetingCore/Transcript.swift"
      - "mcp/**"
      - "makeicon.swift"
      - ".github/workflows/release-mac.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "The release tag (vX.Y.Z) to build and upload to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    env:
      # The release tag: the workflow_call input, or the pushed v* tag; empty for other builds.
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0   # the build number is the commit count

      - name: Version
        id: version
        run: |
          if [[ -n "$TAG" ]]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "dmgbuild==1.6.7"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          command -v cmake || brew install cmake

      - name: Cache whisper-cli
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: build/whisper-cli
          key: whisper-cli-${{ hashFiles('packaging/build-whisper.sh') }}

      - name: Build whisper-cli (universal, static, Metal)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: bash packaging/build-whisper.sh build/whisper-cli

      - name: Check whisper-cli
        run: |
          # (grep >/dev/null, not grep -q: with pipefail an early exit would fail the step)
          [[ " $(lipo -archs build/whisper-cli) " == *" arm64 "* && " $(lipo -archs build/whisper-cli) " == *" x86_64 "* ]]
          build/whisper-cli --help 2>&1 | grep -- "--vad" >/dev/null
          otool -L build/whisper-cli

      - name: Cache llama-completion
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: build/llama-completion
          key: llama-completion-${{ hashFiles('packaging/build-llama.sh') }}

      - name: Build llama-completion (universal, static, Metal)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: bash packaging/build-llama.sh build/llama-completion

      - name: Check llama-completion
        run: |
          [[ " $(lipo -archs build/llama-completion) " == *" arm64 "* && " $(lipo -archs build/llama-completion) " == *" x86_64 "* ]]
          build/llama-completion --help 2>&1 | grep -- "--no-display-prompt" >/dev/null
          otool -L build/llama-completion

      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: build/models
          key: models-${{ hashFiles('packaging/fetch-models.sh') }}

      - name: Models (checksums verified)
        run: bash packaging/fetch-models.sh build/models

      - name: Build the app
        run: |
          WHISPER_CLI=build/whisper-cli LLAMA_CLI=build/llama-completion MODELS_DIR=build/models \
            bash packaging/build-app.sh build "${{ steps.version.outputs.version }}"

      - name: Build the disk image
        run: bash packaging/make-dmg.sh "build/Meeting Notes.app" build/MeetingNotes.dmg

      - name: Smoke test the disk image
        run: |
          MOUNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" build/MeetingNotes.dmg
          APP="$MOUNT/Meeting Notes.app"
          test -L "$MOUNT/Applications"
          codesign --verify --strict --deep "$APP"
          for exe in MeetingNotes whisper-cli llama-completion meetingnotes-mcp; do
            archs=" $(lipo -archs "$APP/Contents/MacOS/$exe") "
            echo "$exe:$archs"
            [[ "$archs" == *" arm64 "* && "$archs" == *" x86_64 "* ]]
          done
          "$APP/Contents/MacOS/whisper-cli" --help >/dev/null 2>&1 || [[ $? -le 1 ]]
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | "$APP/Contents/MacOS/meetingnotes-mcp" | grep '"serverInfo"' >/dev/null
          unzip -p "$APP/Contents/Resources/MeetingNotes.mcpb" manifest.json | python3 -c 'import json,sys; m=json.load(sys.stdin); assert m["server"]["entry_point"]=="server/launch.sh"; print(m["version"])'
          [[ "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" == "${{ steps.version.outputs.version }}" ]]
          for m in ggml-large-v3-turbo.bin ggml-silero-v5.1.2.bin gemma-3-4b-it-Q4_K_M.gguf; do
            cmp "$APP/Contents/Resources/models/$m" "build/models/$m"
          done
          # The built-in notes model answers (on the runner's CPU, so only a few tokens).
          printf '<start_of_turn>user\nSay OK.<end_of_turn>\n<start_of_turn>model\n' > "$RUNNER_TEMP/prompt.txt"
          "$APP/Contents/MacOS/llama-completion" -m "$APP/Contents/Resources/models/gemma-3-4b-it-Q4_K_M.gguf" \
            -f "$RUNNER_TEMP/prompt.txt" -c 512 -n 8 -ngl 0 -no-cnv --no-display-prompt --no-warmup --simple-io \
            2>/dev/null | tee "$RUNNER_TEMP/answer.txt"
          [[ -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/answer.txt")" ]]
          hdiutil detach "$MOUNT"

      - name: Size
        id: size
        run: |
          SIZE=$(stat -f %z build/MeetingNotes.dmg)
          echo "MeetingNotes.dmg: $SIZE bytes"
          echo "bytes=$SIZE" >> "$GITHUB_OUTPUT"
          # GitHub release files must be under 2 GiB.
          if (( SIZE < 2147483648 )); then echo "fits=true" >> "$GITHUB_OUTPUT"; else echo "fits=false" >> "$GITHUB_OUTPUT"; fi

      # Always kept here, also for releases: the disk image is too big for the release itself.
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingNotes-dmg
          path: build/MeetingNotes.dmg
          retention-days: 30
          compression-level: 0   # a disk image is already compressed

      - name: Upload to the GitHub Release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FITS: ${{ steps.size.outputs.fits }}
          BYTES: ${{ steps.size.outputs.bytes }}
        run: |
          # The Windows job may create the release at the same moment: create it only if missing,
          # and accept losing that race.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Meeting Notes ${TAG#v}" --generate-notes \
              || gh release view "$TAG" >/dev/null
          fi
          if [[ "$FITS" == true ]]; then
            gh release upload "$TAG" build/MeetingNotes.dmg --clobber
          else
            GB=$(awk "BEGIN { printf \"%.1f\", $BYTES / 1e9 }")
            echo "::notice title=Mac disk image not uploaded::MeetingNotes.dmg is $GB GB, over GitHub's 2 GB limit for release files. Download it from this run's artifacts (MeetingNotes-dmg, kept 30 days) and host it yourself."
            {
              echo "### Mac disk image"
              echo "MeetingNotes.dmg ($GB GB) is over GitHub's 2 GB limit for release files, so it isn't attached to the release."
              echo "Download it from this run's artifacts (**MeetingNotes-dmg**, kept 30 days) and host it yourself."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
