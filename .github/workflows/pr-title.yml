name: PR title

# Pull requests are squash-merged, so the title becomes the commit message on main, and release-please reads
# those commits to pick the next version. This checks that the title follows Conventional Commits.
# See CONTRIBUTING.md.

on:
  # pull_request_target so it also runs for pull requests from forks; nothing from the pull request is checked out.
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            mac
            windows
            android
            ios
            website
            mcp
            deps
          requireScope: false
