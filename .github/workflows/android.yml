name: Android

# Builds the APK (and the Play bundle). On a v* tag the APK is attached to that GitHub Release. The release-please
# workflow also calls it (workflow_call) with the tag it just created, since tags made with GITHUB_TOKEN do not
# trigger workflows.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['src/**', 'tests/**', 'mcp/**', 'install.sh']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_call:
    inputs:
      tag:
        description: 'The release tag (vX.Y.Z) to build and upload to'
        required: true
        type: string

permissions:
  contents: write   # to attach the APK to a release

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    env:
      # The release tag: the workflow_call input, or the pushed v* tag; empty for other builds.
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0   # the version code is the commit count

      # The models pass through several build steps at 1.4 GB each; make room on the runner.
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The default models for the install-time asset pack (about 1.4 GB), downloaded by Gradle and checked by SHA-256.
      - uses: actions/cache@v4
        with:
          path: android/models/src/main/assets
          key: bundled-models-${{ hashFiles('android/bundled-models.txt') }}

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest -PnoBundledModels

      # Signs with the repository's release key when the secrets are set (so updates install over older
      # versions), otherwise with a throwaway debug key.
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key."
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionCode must only grow: the commit count does across workflows (a run number is per workflow, and
          # the release-please workflow has its own). v1.0.0 had 19 (the run number then); main is past that.
          VERSION_CODE="$(git rev-list --count HEAD)"
          export VERSION_CODE
          if [[ -n "$TAG" ]]; then export VERSION_NAME="${TAG#v}"; fi
          # The app bundle for Google Play (models in an install-time asset pack), and from it the universal APK.
          ./gradlew --no-daemon :app:universalApk
          mv app/build/outputs/bundle/release/app-release.aab MeetingNotes.aab
          mv app/build/outputs/universal/MeetingNotes.apk MeetingNotes.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs MeetingNotes.apk | head -3 || true
          ls -l MeetingNotes.aab MeetingNotes.apk
          # GitHub release assets must be under 2 GiB.
          test "$(stat -c%s MeetingNotes.apk)" -lt 2147483648

      - uses: actions/upload-artifact@v4
        with:
          name: MeetingNotes-android
          path: |
            android/MeetingNotes.apk
            android/MeetingNotes.aab
          if-no-files-found: error
          compression-level: 0   # the models are already compressed

      - name: Attach to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The Mac and Windows jobs attach their installers to the same release; whichever runs first creates it.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Meeting Notes ${TAG#v}" --generate-notes \
            || true
          gh release upload "$TAG" MeetingNotes.apk --clobber
